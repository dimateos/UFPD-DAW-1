    /* 1) Devuelve si la cadena es palindroma ignorando espacios, mayusculas y acentos. */
    function esPalindromo(cadena) {
      let cc = String(cadena).toLowerCase().replaceAll(" ", "");

      // aun faltan los acentos -> normalize parece lo mejor (que reemplazar cada letra con acento...)
      // REF:: https://stackoverflow.com/questions/990904/remove-accents-diacritics-in-a-string-in-javascript
      cc = cc.normalize("NFD").replace(/\p{Diacritic}/gu, "");
      //console.log("cc", cc);

      for (let i = 0; i < cc.length; i++) {
        if (cc[i] != cc[cc.length-1-i])
          return false;
      }
      return true;
    }

    /* 2) Devuelve las iniciales de cada palabra usando split y substr. */
    function obtenerIniciales(nombreCompleto) {
      let names = String(nombreCompleto).split(" ");

      // tiene que haber mejores formas usando array.map, pero un loop como el anterior sobra
      let siglas = "";
      for (let i = 0; i < names.length; i++) {
        let n = names[i];
        siglas += n.substring(0,1).toUpperCase();
      }
      return siglas;
    }

    /* 3) Devuelve las palabras de una oracion en orden inverso. */
    function revertirPalabras(oracion) {
      let palabras = String(oracion).split(" ");

      // parecido al loop del ejercicio anterior, y en este caso creo que no valdria array.map
      // OPT:: bueno puedes hacer un reverse a la lista y join todo con espacios
      let sarbalap = "";
      for (let i = 0; i < palabras.length; i++) {
        let p = palabras[palabras.length-1-i];
        sarbalap += p + " ";
      }
      return sarbalap;
    }

    /* 4) Desplaza cada letra una posicion en el alfabeto; z pasa a ser a. */
    function desplazarLetras(cadena) {
      // ascii del cada char se puede sumar 1 y tener un caso especial para el ultimo que haga loop? como en c++?
      // REF:: https://stackoverflow.com/questions/10879244/how-to-get-the-ascii-value-in-javascript-for-the-characters

      let cadena_shifted = "";
      for (let i = 0; i < cadena.length; i++) {
        let c = cadena[i];

        // loop (naive handle edge cases)
        if (c === "z") cadena_shifted += "a";
        else if (c === "Z") cadena_shifted += "A";

        // shift directamente ignorando caracteres especiales ascii (naive de nuevo)
        else cadena_shifted += String.fromCharCode(c.charCodeAt(0)+1);
      }
      return cadena_shifted;
    }

    /* 5) Cuenta las vocales de una cadena, incluidas las vocales acentuadas. */
    function contarVocales(cadena) {
      // siguiendo ejercicio 1 que elimina acentos
      let cc = String(cadena).toLowerCase().replaceAll(" ", "");
      cc = cc.normalize("NFD").replace(/\p{Diacritic}/gu, "");

      // no he visto que String tenga count o similar asi que loop
      const vocales = "aeiou";
      let counter = 0;
      for (let i = 0; i < cc.length; i++) {
        for (let j = 0; j < vocales.length; j++) {
          if (cc[i] == vocales[j]) counter++;
        }
      }
      return counter;
    }
